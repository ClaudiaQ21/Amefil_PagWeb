{% extends "maestra.html" %}
{% block titulo %}
Amefil
{% endblock %}
{% block estilos_adicionales %}
<link rel="stylesheet" href="{{ url_for('static', filename='CSS/Formulario.css') }}">
{% endblock %}

{% block contenido %}
<div class="container">
    <div class="row titulo">
        <div class="col py-4">
            <h1>Agregar Descuento</h1>
        </div>
    </div>
    <div class="col-12 my-2 formrol">
        <div class="row">
            <div class="col-12 p-2">
                <div class="roldate">
                    <form action="{{ url_for('guardar_descuento') }}" method="post" class="p-2">
                        <div class="form-group">
                            <label for="tasa">Tasa:</label>
                            <input type="number" step="0.01" class="form-control" id="tasa" name="tasa" placeholder="Ingrese tasa del descuento" required>
                        </div>
                        <div class="form-group">
                            <label for="fecha_inicio">Fecha de Inicio:</label>
                            <input type="date" class="form-control" id="fecha_inicio" name="fecha_inicio" required>
                        </div>
                        <div class="form-group">
                            <label for="fecha_fin">Fecha de Fin:</label>
                            <input type="date" class="form-control" id="fecha_fin" name="fecha_fin" required>
                        </div>
                        <div class="form-group">
                            <label for="vigencia">Vigencia:</label>
                            <select class="form-select" id="vigencia" name="vigencia" required>
                                <option value="0">Vigente</option>
                                <option value="1">No vigente</option>
                            </select>
                        </div>
                        <button type="submit" class="btn mt-3 save">Guardar</button>
                        <a href="{{ url_for('dashboardadmin') }}" class="btn mt-3 back">Volver</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
