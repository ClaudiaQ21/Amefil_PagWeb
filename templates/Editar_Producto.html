{% extends "maestra.html" %}
{% block titulo %}
Amefil
{% endblock %}
{% block estilos_adicionales %}
<link rel="stylesheet" href="{{ url_for('static', filename='CSS/Formulario.css') }}">
{% endblock %}

{% block contenido %}
<div class="container">
    <div class="row titulo">
        <div class="col py-4">
            <h1>Editar Producto</h1>
        </div>
    </div>
    <div class="col-12 my-2 formrol">
        <div class="row">
            <div class="col-12 p-2">
                <div class="roldate">
                    <form action="{{ url_for('actualizar_producto') }}" method="post" enctype="multipart/form-data" class="p-2">
                        <input type="hidden" id="id_producto" name="id_producto" value="{{producto[0]}}">
                        <div class="form-group">
                            <label for="nombre">Nombre:</label>
                            <input type="text" class="form-control" id="nombre" name="nombre" value="{{producto[1]}}" required>
                        </div>
                        <div class="form-group">
                            <label for="precio">Precio:</label>
                            <input type="number" step="0.01" class="form-control" id="precio" name="precio" value="{{producto[2]}}" required>
                        </div>
                        <div class="form-group">
                            <label for="vigencia">Vigencia:</label>
                            <select class="form-control" id="vigencia" name="vigencia" required>
                                <option value="0" {% if producto[3] == 0 %}selected{% endif %}>Vigente</option>
                                <option value="1" {% if producto[3] == 1 %}selected{% endif %}>No vigente</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="stock">Stock:</label>
                            <input type="number" class="form-control" id="stock" name="stock" value="{{producto[4]}}" required>
                        </div>
                        <div class="form-group">
                            <label for="descripcion">Descripción:</label>
                            <textarea class="form-control" id="descripcion" name="descripcion" required>{{producto[5]}}</textarea>
                        </div>
                        <div class="form-group">
                            <label for="id_tipo_producto">Tipo de Producto:</label>
                            <select class="form-control" id="id_tipo_producto" name="id_tipo_producto" required>
                                {% for tipo_producto in tipos_productos %}
                                    <option value="{{ tipo_producto[0] }}">{{ tipo_producto[1] }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="id_color">Color:</label>
                            <select class="form-control" id="id_color" name="id_color" required>
                                {% for color in colores %}
                                    <option value="{{ color[0] }}">{{ color[1] }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="id_temporada">Temporada:</label>
                            <select class="form-control" id="id_temporada" name="id_temporada" required>
                                {% for temporada in temporadas %}
                                    <option value="{{ temporada[0] }}">{{ temporada[1] }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="imagen">Imagen del producto:</label>
                            <input type="file" class="form-control" id="imagen" name="imagen">
                        </div>
                        <button type="submit" class="btn mt-3 save">Guardar</button>
                        <a href="{{ url_for('dashboardadmin') }}" class="btn mt-3 back">Volver</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
