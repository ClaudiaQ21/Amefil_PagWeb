{% extends "maestraPerfil.html" %}

{% block estilosPerfil %}
    <link rel="stylesheet" href="css/Direccion_editar.css"> 
{% endblock %}

{% block contenidoPerfil %}
    <main class="row m-0 p-0">
        <div class="contenedor py-lg-5 py-md-4 py-4">
            <div class="row d-flex justify-content-center">
                <nav id="central" class="col-lg-8 col-md-12 col-sm-12 titulo bloque">
                    <div class="row g-5">
                        <div class="col-lg-6 col-md-6 col-sm-12">
                            <label class="form-label">Distritos</label>
                            <select class="form-select" aria-label="Default select example">
                                <option selected>--Seleccione su distrito--</option>
                                <option value="1">Perú</option>
                                <option value="2">Argentina</option>
                                <option value="3">E.E.U.U</option>
                            </select>
                        </div>
                        <div class="col-lg-6 col-md-6 col-sm-12">
                            <label class="form-label">Departamento</label>
                            <select class="form-select" aria-label="Default select example">
                                <option selected>--Seleccione su departamento--</option>
                                <option value="1">Perú</option>
                                <option value="2">Argentina</option>
                                <option value="3">E.E.U.U</option>
                            </select>
                        </div>
                        <div class="col-lg-6 col-md-6 col-sm-12">
                            <label class="form-label">Calle</label>
                            <input type="text" class="form-control" id="lab">
                        </div>
                        <div class="col-lg-6 col-md-6 col-sm-12">
                            <label class="form-label">Provincia</label>
                            <select class="form-select" aria-label="Default select example">
                                <option selected>--Seleccione su provincia--</option>
                                <option value="1">Perú</option>
                                <option value="2">Argentina</option>
                                <option value="3">E.E.U.U</option>
                            </select>
                        </div>
                        <div class="col-lg-6 col-md-6 col-sm-12">
                            <label class="form-label" >N° de calle</label>
                            <input type="text" id="lab" class="form-control">
                            <br>
                            
                            <label class="form-check-label" for="flexRadioDefault1"><input type="radio">
                                No tengo calle
                            </label>
                        </div>
                        <div class="col-lg-12 col-md-12 col-sm-12">
                            <label class="form-label" >Información adicional</label>
                            <input type="text" id="lab" class="form-control">
                        </div>
                        <div class="col-lg-12">
                            <a class="btn botones" id="but_bloque" type="submit" href="{{ url_for('listadirecciones')}}">Guardar cambios</a>
                        </div>
                    </div>                            
                </nav>
            </div>
    </main>    
{% endblock %}
