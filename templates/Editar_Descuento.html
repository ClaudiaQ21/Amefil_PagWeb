{% extends "maestra.html" %}
{% block titulo %}
Amefil
{% endblock %}
{% block estilos_adicionales %}
<link rel="stylesheet" href="{{ url_for('static', filename='CSS/Formulario.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='CSS/PopUp.css') }}">
{% endblock %}

{% block contenido %}
<div class="container">
    <div class="row titulo">
        <div class="col py-4">
            <h1>Editar Descuento</h1>
        </div>
    </div>
    <div class="col-12 my-2 formrol">
        <div class="row">
            <div class="col-12 p-2">
                <div class="roldate">
                    <form action="{{ url_for('actualizar_descuento') }}" method="post" class="p-2" id="editarProductoForm">
                        <input type="hidden" name="id_descuento" value="{{ descuento[0] }}">
                        <div class="form-group">
                            <label for="tasa">Tasa:</label>
                            <input type="number" step="0.01" class="form-control" id="tasa" name="tasa" value="{{ descuento[1] }}" required>
                        </div>
                        <div class="form-group">
                            <label for="fecha_inicio">Fecha de Inicio:</label>
                            <input type="date" class="form-control" id="fecha_inicio" name="fecha_inicio" value="{{ descuento[2] }}" required>
                        </div>
                        <div class="form-group">
                            <label for="fecha_fin">Fecha de Fin:</label>
                            <input type="date" class="form-control" id="fecha_fin" name="fecha_fin" value="{{ descuento[3] }}" required>
                        </div>
                        <div class="form-group">
                            <label for="vigencia">Vigencia:</label>
                            <select class="form-select" id="vigencia" name="vigencia" required>
                                <option value="0" {% if descuento[4] == 0 %}selected{% endif %}>Vigente</option>
                                <option value="1" {% if descuento[4] == 1 %}selected{% endif %}>No vigente</option>
                            </select>
                        </div>
                        <button type="submit" class="btn mt-3 save">Actualizar</button>
                        <a href="{{ url_for('descuentoadmin') }}" class="btn mt-3 back">Volver</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="confirmPopup" class="popup">
    <div class="popup-content">
        <h3>Confirmar cambios</h3>
        <p>¿Estás seguro de que quieres guardar los cambios?</p>
        <button id="confirmBtn" class="btn save">Confirmar</button>
        <button id="cancelBtn" class="btn back">Cancelar</button>
    </div>
</div>
{% endblock %}

{% block scripts_adicionales %}
<script src="{{ url_for('static', filename='js/popup.js') }}"></script>
{% endblock %}
