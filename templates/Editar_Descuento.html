{% extends "maestra.html" %}
{% block titulo %}
Amefil
{% endblock %}
{% block estilos_adicionales %}
<link rel="stylesheet" href="{{ url_for('static', filename='CSS/Formulario.css') }}">
{% endblock %}

{% block contenido %}
<div class="container">
    <div class="row titulo">
        <div class="col py-4">
            <h1>Editar Descuento</h1>
        </div>
    </div>
    <div class="col-12 my-2 formrol">
        <div class="row">
            <div class="col-12 p-2">
                <div class="roldate">
                    <form action="{{ url_for('actualizar_descuento') }}" method="post" class="p-2">
                        <input type="hidden" name="id_descuento" value="{{ descuento[0] }}">
                        <div class="form-group">
                            <label for="tasa">Tasa:</label>
                            <input type="number" step="0.01" class="form-control" id="tasa" name="tasa" value="{{ descuento[1] }}" required>
                        </div>
                        <div class="form-group">
                            <label for="fecha_inicio">Fecha de Inicio:</label>
                            <input type="date" class="form-control" id="fecha_inicio" name="fecha_inicio" value="{{ descuento[2] }}" required>
                        </div>
                        <div class="form-group">
                            <label for="fecha_fin">Fecha de Fin:</label>
                            <input type="date" class="form-control" id="fecha_fin" name="fecha_fin" value="{{ descuento[3] }}" required>
                        </div>
                        <div class="form-group">
                            <label for="vigencia">Vigencia:</label>
                            <input type="number" class="form-control" id="vigencia" name="vigencia" value="{{ descuento[4] }}" required>
                        </div>
                        <button type="submit" class="btn mt-3 save">Actualizar</button>
                        <a href="{{ url_for('descuentoadmin') }}" class="btn mt-3 back">Volver</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
