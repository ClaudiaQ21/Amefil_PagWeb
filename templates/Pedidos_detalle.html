{% extends "maestraPerfil.html" %}

{% block estilosPerfil %}
<link rel="stylesheet" href="{{url_for('static', filename = 'CSS/Pedidos_lista.css')}}">
{% endblock %}

{% block contenidoPerfil %}
<div class="row">
    <h6>Total: </h6>
</div>
<div class="row d-flex justify-content-center">
    <!-- Contenedor de productos -->
    <div class="container">
        <div class="row">
            {% for detalle in detalles_con_imagen %}
                <div class="col-lg-3 col-md-6 col-sm-12 mb-4"> <!-- 4 columnas por fila en pantallas grandes -->
                    <div class="cardProduct">
                        <img src="data:image/jpeg;base64,{{ detalle[5] }}" class="card-img-top imgProduct">
                        <div class="g-2">
                            <h6 class="mt-2">{{detalle[8]}}</h6>
                            <div class="precio">
                                <p class="mb-0">S/{{detalle[7]}}</p>
                            </div>
                            <div class="d-flex justify-content-end"> 
                                <b><p class="mb-0 mt-2">SubTotal</p></b>
                            </div>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
