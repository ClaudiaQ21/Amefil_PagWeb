{% extends "maestra.html" %}
{% block titulo %}
Amefil
{% endblock %}
{% block estilos_adicionales %}
<link rel="stylesheet" href="{{ url_for('static', filename='CSS/Formulario.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='CSS/PopUp.css') }}">
{% endblock %}

{% block contenido %}
<div class="container">
    <div class="row titulo">
        <div class="col py-4">
            <h1>Editar Asignación</h1>
        </div>
    </div>
    <div class="col-12 my-2 formrol">
        <div class="row">
            <div class="col-12 p-2">
                <div class="roldate">
                    <form action="{{ url_for('editarasignardcto') }}" method="post" class="p-2" id="editarProductoForm">
                        <input type="hidden" id="id_producto" name="id_producto" value="{{ producto[0] }}">
                        <div class="form-group">
                            <label for="nombre">Nombre de Producto:</label>
                            <input type="text" class="form-control" id="nombre" name="nombre" value="{{ producto[1] }}" required>
                        </div>
                        <div class="form-group">
                            <label for="id_descuento">Descuento:</label>
                            <select class="form-select" name="id_descuento" id="id_descuento" required>
                                {% for descuento in descuentos %}
                                    <option value="{{ descuento[0] }}">{{ descuento[1] }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <button type="submit" class="btn mt-3 save">Asignar</button>
                        <a href="{{ url_for('descuentoadmin') }}" class="btn mt-3 back">Volver</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="confirmPopup" class="popup">
    <div class="popup-content">
        <h3>Confirmar cambios</h3>
        <p>¿Estás seguro de que quieres guardar los cambios?</p>
        <button id="confirmBtn" class="btn save">Confirmar</button>
        <button id="cancelBtn" class="btn back">Cancelar</button>
    </div>
</div>
{% endblock %}

{% block scripts_adicionales %}
<script src="{{ url_for('static', filename='js/popup.js') }}"></script>
{% endblock %}
