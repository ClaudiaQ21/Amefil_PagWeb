{% extends "maestra.html" %}
{% block titulo %}
Reestablecer contraseña
{% endblock %}

{% block estilos_adicionales %}
<link rel="stylesheet" href="{{ url_for('static', filename='CSS/Reestablecer_contraseña_2.css') }}">
{% endblock %}

{% block contenido %}
    <main>
        <div class="container-fluid">
            <div class="row justify-content-center align-items-center">
                <div class=" col-sm-8 col-md-6 col-lg-4 my-5" id="Contenedor">
                    <div class="card shadow-lg">
                        <div class="card-body" id="bloque">
                            <h4 class="card-title text-center">REESTABLECER CONTRASEÑA</h4>
                            <form id="signup" class="form">
                                <div class="form-group">
                                    <label for="new-password">Nueva contraseña</label>
                                    <input type="password" class="form-control" id="new-password" placeholder="Ingrese su nueva contraseña">
                                    <small></small>
                                </div>
                                <div class="form-group">
                                    <label for="confirm-password">Confirmar contraseña</label>
                                    <input type="password" class="form-control" id="confirm-password" placeholder="Confirme su nueva contraseña">
                                    <small></small>
                                </div>
                                <div class="form-group text-center">
                                    <button type="submit" class="botones" id="but">Reestablecer</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
    </main>


    <script src="{{ url_for('static', filename='JS/header_footer.js') }}"></script>
    <script src="{{ url_for('static', filename='JS/Reestablecer_contraseña_2.js') }}"></script>
    
    {% endblock %}
