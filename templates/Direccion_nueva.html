{% extends "maestraPerfil.html" %}

{% block estilosPerfil %}
    <link rel="stylesheet" href="{{ url_for('static', filename = 'CSS/Direccion_nueva.css')}}">
{% endblock %}

{% block contenidoPerfil %}
<div class="contenedor">
    <div id="con" class="row d-flex justify-content-center">
        <nav class="col-lg-8 col-md-12 col-sm-12 titulo bloque">
            <div class="row g-5">
                <div class="col-lg-6 col-md-6 col-sm-12">
                    <label class="form-label">Distritos</label>
                    <select class="form-select" aria-label="Default select example">
                        <option selected>--Seleccione su distrito--</option>
                        <option value="1">Perú</option>
                        <option value="2">Argentina</option>
                        <option value="3">E.E.U.U</option>
                    </select>
                </div>
                <div class="col-lg-6 col-md-6 col-sm-12">
                    <label class="form-label">Departamento</label>
                    <select class="form-select" aria-label="Default select example">
                        <option selected>--Seleccione su departamento--</option>
                        <option value="1">Perú</option>
                        <option value="2">Argentina</option>
                        <option value="3">E.E.U.U</option>
                    </select>
                </div>
                <div class="col-lg-6 col-md-6 col-sm-12">
                    <label class="form-label">Dirección</label>
                    <input type="text" class="form-control" id="lab">
                </div>
                <div class="col-lg-6 col-md-6 col-sm-12">
                    <label class="form-label">Provincia</label>
                    <select class="form-select" aria-label="Default select example">
                        <option selected>--Seleccione su provincia--</option>
                        <option value="1">Perú</option>
                        <option value="2">Argentina</option>
                        <option value="3">E.E.U.U</option>
                    </select>
                </div>
                
                <div class="col-lg-12">
                    <a class="btn botones" id="but_bloque" type="submit" href="{{ url_for('listadirecciones')}}">Añadir dirección</a>
                </div>
            </div>            
        </nav>
    </div>
</div>
{% endblock %}
