{% extends "maestraPerfil.html" %}

{% block estilosPerfil %}
    <link rel="stylesheet" href="{{ url_for('static', filename = 'CSS/Direcciones.css')}}">
{% endblock %}

{% block contenidoPerfil %}
<div class="contenedor">
    <div id="con" class="row d-flex justify-content-center">
        <nav class="col-lg-8 col-md-12 col-sm-12 titulo bloque">
            <form action="{{ url_for('guardar_direccion') }}" method="post" class="row">
                <div class="col-lg-6 col-md-6 col-sm-12 dataAddress">
                    <label class="form-label">Departamento:</label>
                    <select class="form-select" id="id_departamento" name="id_departamento" aria-label="Default select example" onchange="loadProvincias()">
                        <option selected>--Seleccione su departamento--</option>
                        {% for departamento in departamentos %}
                        <option value="{{departamento[0]}}">{{departamento[1]}}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-lg-6 col-md-6 col-sm-12 dataAddress">
                    <label class="form-label">Provincia:</label>
                    <select class="form-select" id="id_provincia" name="id_provincia" aria-label="Default select example" onchange="loadDistritos()">
                        <option selected>--Seleccione su provincia--</option>
                    </select>
                </div>

                <div class="col-lg-6 col-md-6 col-sm-12 dataAddress">
                    <label class="form-label">Distrito:</label>
                    <select class="form-select" id="id_distrito" name="id_distrito" aria-label="Default select example">
                        <option selected>--Seleccione su distrito--</option>
                    </select>
                </div>

                <div class="col-lg-6 col-md-6 col-sm-12 dataAddress">
                    <label class="form-label">Dirección:</label>
                    <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ingrese su dirección" required>
                </div>

                <div class="col-lg-6 col-md-6 col-sm-12 dataAddress">
                    <label class="form-label">Referencia:</label>
                    <input type="text" class="form-control" id="referencia" name="referencia" placeholder="Ingrese una referencia" required>
                </div>
                
                <div class="col-lg-12">
                    <button class="botones" id="buttonBlock" type="submit">Editar dirección</button>
                </div>
            </form>
        </nav>
    </div>
</div>
{% endblock %}

{% block scripts_adicionales %}
<script src="{{url_for('static', filename = 'JS/Select_direccion.js')}}"></script>
{% endblock %}
