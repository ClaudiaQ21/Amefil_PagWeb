{% extends "maestraPerfil.html" %}

{% block estilosPerfil %}

{% endblock %}

{% block contenidoPerfil %}
<div class="col-12 my-2 preview">
    <div class="row">
        {% for pedido in pedidos %}
            <div class="col-6 col-md-3 p-2 order">
                <div class="item p-2">
                    <p><i class="fa-solid fa-bag-shopping icon"></i></p>
                    <p class="mt-2">PD000 - {{}}</p>
                    <p>16/10/2024</p>
                    <a href="{{url_for('detallepedidos')}}"><i class="fa-solid fa-angle-right iconview my-2"></i></a>
                </div>
            </div>
        {% endfor %}
    </div>
</div>

{% endblock %}
