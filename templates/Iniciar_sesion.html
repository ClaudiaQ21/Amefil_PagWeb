{% extends "maestra.html" %}
{% block titulo %}
Iniciar Sesión
{% endblock %}

{% block estilos_adicionales %}
<link rel="stylesheet" href="{{ url_for('static', filename='CSS/Iniciar_sesion.css') }}">
{% endblock %}

{% block contenido %}
<main class="container">
    <div class="row justify-content-center align-items-center">
        <div class="col-12 col-sm-8 col-md-7 col-lg-5">
            <div class="card shadow-lg my-5">
                <div class="card-body" id="bloque">
                    <h4 class="card-title text-center">INICIO DE SESIÓN</h4>
                    <form id="signup" class="form" action="{{url_for('login')}}" method="POST">
                        <div class="form-group">
                            <label for="email">Correo electrónico</label>
                            <input type="email" class="form-control" id="email" name="email"
                                placeholder="Ingrese su correo electrónico" required>
                            <small></small>
                        </div>
                        <div class="form-group">
                            <label for="password">Contraseña</label>
                            <input type="password" class="form-control" id="password" name="password"
                                placeholder="Ingrese su contraseña" required>
                            <small></small>
                        </div>
                        
                        <div class="form-group text-center">
                            <button type="submit" class="botones" id="ing">Ingresar</button>
                        </div>
                        <div class="form-group text-center" id="men2">
                            <span class="small">¿Todavía no tienes cuenta? <a href="{{ url_for('registrar') }}"
                                    id="regis">Regístrate</a></span>
                        </div>
                        {% if error %}
                        <div class="alert alert-danger">{{ error }}</div>
                        {% endif %}
                    </form>
                    
                </div>
            </div>
        </div>
    </div>
</main>




<script src="{{ url_for('static', filename='JS/Iniciar_Sesion.js') }}"></script>

{% endblock %}
