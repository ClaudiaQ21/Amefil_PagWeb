{% extends "maestra.html" %}
{% block titulo %}
Amefil
{% endblock %}
{% block estilos_adicionales %}
<link rel="stylesheet" href="{{ url_for('static', filename='CSS/Formulario.css') }}">
{% endblock %}

{% block contenido %}
<div class="container">
    <div class="row titulo">
        <div class="col py-4">
            <h1>Agregar Usuario</h1>
        </div>
    </div>
    <div class="col-12 my-2 formrol">
        <div class="row">
            <div class="col-12 p-2">
                <div class="roldate">
                    <form action="{{ url_for('guardar_usuario') }}" method="post" enctype="multipart/form-data" class="p-2">
                        <div class="form-group">
                            <label for="nombre">Nombre:</label>
                            <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ingrese el nombre" required>
                        </div>
                        <div class="form-group">
                            <label for="apellido_p">Apellido Paterno:</label>
                            <input type="text" class="form-control" id="apellido_p" name="apellido_p" placeholder="Ingrese el apellido paterno" required>
                        </div>
                        <div class="form-group">
                            <label for="apellido_m">Apellido Materno:</label>
                            <input type="text" class="form-control" id="apellido_m" name="apellido_m" placeholder="Ingrese el apellido materno" required>
                        </div>
                        <div class="form-group">
                            <label for="correo">Correo:</label>
                            <input type="email" class="form-control" id="correo" name="correo" placeholder="Ingrese el correo" required>
                        </div>
                        <div class="form-group">
                            <label for="contrasena">Contraseña:</label>
                            <input type="password" class="form-control" id="contrasena" name="contrasena" placeholder="Ingrese la contraseña" required>
                        </div>
                        <div class="form-group">
                            <label for="telefono">Teléfono:</label>
                            <input type="tel" class="form-control" id="telefono" name="telefono" placeholder="Ingrese el teléfono" required>
                        </div>
                        <div class="form-group">
                            <label for="genero">Género:</label>
                            <select class="form-select" id="genero" name="genero" required>
                                <option value="0">Femenino</option>
                                <option value="1">Masculino</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="nacimiento">Fecha de Nacimiento:</label>
                            <input type="date" class="form-control" id="nacimiento" name="nacimiento" required>
                        </div>
                        <div class="form-group">
                            <label for="id_tipo">Tipo de Usuario:</label>
                            <select class="form-select" id="id_tipo" name="id_tipo" required>
                                {% for tipo_usuario in tipo_usuarios %}
                                    <option value="{{ tipo_usuario[0] }}">{{ tipo_usuario[1] }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="id_direccion">Dirección:</label>
                            <select class="form-control" id="id_direccion" name="id_direccion" required>
                                {% for direccion in direcciones %}
                                    <option value="{{ direccion[0] }}">{{ direccion[1] }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <button type="submit" class="btn mt-3 save">Guardar</button>
                        <a href="{{ url_for('dashboardadmin') }}" class="btn mt-3 back">Volver</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
