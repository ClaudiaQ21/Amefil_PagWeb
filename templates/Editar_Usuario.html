{% extends "maestra.html" %}
{% block titulo %}
Amefil
{% endblock %}
{% block estilos_adicionales %}
<link rel="stylesheet" href="{{ url_for('static', filename='CSS/Formulario.css') }}">
{% endblock %}

{% block contenido %}
<div class="container">
    <div class="row titulo">
        <div class="col py-4">
            <h1>Editar Usuario</h1>
        </div>
    </div>
    <div class="col-12 my-2 formrol">
        <div class="row">
            <div class="col-12 p-2">
                <div class="roldate">
                    <form action="{{ url_for('actualizar_usuario') }}" method="post" class="p-2">
                        <input type="hidden" name="id_usuario" value="{{ usuario[0] }}">
                        
                        <div class="form-group">
                            <label for="nombre">Nombre:</label>
                            <input type="text" class="form-control" id="nombre" name="nombre" value="{{ usuario[1] }}" required>
                        </div>

                        <div class="form-group">
                            <label for="apellido_p">Apellido Paterno:</label>
                            <input type="text" class="form-control" id="apellido_p" name="apellido_p" value="{{ usuario[2] }}" required>
                        </div>

                        <div class="form-group">
                            <label for="apellido_m">Apellido Materno:</label>
                            <input type="text" class="form-control" id="apellido_m" name="apellido_m" value="{{ usuario[3] }}" required>
                        </div>

                        <div class="form-group">
                            <label for="correo">Correo:</label>
                            <input type="email" class="form-control" id="correo" name="correo" value="{{ usuario[4] }}" required>
                        </div>

                        <div class="form-group">
                            <label for="contrasena">Contraseña:</label>
                            <input type="password" class="form-control" id="contrasena" name="contrasena" value="{{ usuario[5] }}" required>
                        </div>

                        <div class="form-group">
                            <label for="telefono">Teléfono:</label>
                            <input type="text" class="form-control" id="telefono" name="telefono" value="{{ usuario[6] }}" required>
                        </div>

                        <div class="form-group">
                            <label for="genero">Género:</label>
                            <select class="form-control" id="genero" name="genero" required>
                                <option value="0" {% if usuario[7] == 0 %}selected{% endif %}>Femenino</option>
                                <option value="1" {% if usuario[7] == 1 %}selected{% endif %}>Masculino</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="nacimiento">Fecha de Nacimiento:</label>
                            <input type="date" class="form-control" id="nacimiento" name="nacimiento" value="{{ usuario[8] }}" required>
                        </div>

                        <div class="form-group">
                            <label for="id_tipo">Tipo de Usuario:</label>
                            <select class="form-control" id="id_tipo" name="id_tipo" required>
                                {% for tipo_usuario in tipo_usuarios %}
                                    <option value="{{ tipo_usuario[0] }}" {% if usuario[9] == tipo_usuario[0] %}selected{% endif %}>
                                        {{ tipo_usuario[1] }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="id_direccion">Dirección:</label>
                            <select class="form-control" id="id_direccion" name="id_direccion" required>
                                {% for direccion in direcciones %}
                                    <option value="{{ direccion[0] }}" {% if usuario[10] == direccion[0] %}selected{% endif %}>
                                        {{ direccion[1] }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>

                        <button type="submit" class="btn mt-3 save">Actualizar</button>
                        <a href="{{ url_for('usuariosdash') }}" class="btn mt-3 back">Volver</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
