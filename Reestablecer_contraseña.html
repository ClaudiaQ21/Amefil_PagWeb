<body>
    <div id="header">

    <main class="container-fluid">
        <div class="container-fluid">
            <div class="row justify-content-center align-items-center my-5">
                <div class="col-12 col-sm-8 col-md-6 col-lg-5">
                    <div class="card shadow-lg">
                        <div class="card-body " id="bloque">
                            <h4 class="card-title text-center">REESTABLECER CONTRASEÑA</h4>
                            <p id="mensaje" >Para restablecer tu contraseña, por favor introduce tu dirección de correo electrónico. Te enviaremos un enlace para que puedas crear una nueva contraseña.</p>
                            <form>
                                <div class="form-group">
                                    <label for="email">Correo electrónico</label>
                                    <input type="email" class="form-control" id="email" placeholder="Ingrese su correo electrónico">
                                </div>
                                <br>
                                <div class="form-group text-center">
                                    <button type="submit" class="btn btn-primary" id="but">Enviar correo</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
    </main>

    <div id="footer">

    </div>
