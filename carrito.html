<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/Carro de compras.css">
    <title>Carrito de compras</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/encabezado_pie.css">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/Draggable.min.js"></script>
    <link rel="icon" href="img/img_logo/logoAmefil - solo logo.svg">
</head>

<body>
    <div id="header">

    </div>

    <main class="container mt-5">
        <!-- <h3><b>CARRITO DE COMPRAS</b></h3> -->
        <div class="row">
            <nav class="col-8">
                <table class="table">
                    <thead>
                        <tr>
                            <th scope="col">Imagen</th>
                            <th scope="col">Producto</th>
                            <th scope="col">Precio</th>
                            <th scope="col">Cantidad</th>
                            <th scope="col">Total</th>
                            <th scope="col"></th>
                        </tr>
                    </thead>
                    <tbody id="cart">
                        <!-- Carrito -->
                    </tbody>
                </table>
            </nav>
            <section class="col-4">
                <div class="container text-start">
                    <div class="row g-4 justify-content-center">
                        <h6 class="text-center">GENERAR COMPRA</h6>
                        <div class="col-lg-10 col-md-10 col-sm-12">
                            <label class="form-label">Subtotal:</label>
                            <input type="text" class="form-control" id="subtotal" readonly>
                        </div>
                        <div class="col-lg-10 col-md-10 col-sm-12">
                            <label class="form-label">Descuento:</label>
                            <input type="text" class="form-control" id="descuento" value="0" readonly>
                        </div>
                        <div class="col-lg-10 col-md-10 col-sm-12">
                            <label class="form-label">Total a pagar:</label>
                            <input type="text" class="form-control" id="total" readonly>
                        </div>
                        <br>
                        <div class="col-lg-7 col-md-7 col-sm-12">
                            <button type="button" class="botones agregar-carrito" onclick="location.href='Finalizar_compra.html'">Finalizar compra</button>                       
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <br>
    <br>
    <div id="footer">

    </div>
    
    <script src="JS/jquery-3.7.1.slim.min.js"></script>
    <script src="JS/bootstrap.bundle.min.js"></script>
    <script src="JS/carrito.js"></script>
    <script src="JS/header_footer.js"></script>

</body>

</html>
