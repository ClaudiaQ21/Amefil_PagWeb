<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/Reestablecer_contraseña_2.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/Draggable.min.js"></script>

    <link rel="stylesheet" href="css/encabezado_pie.css">
    <title>Reestablecer contraseña</title>
</head>
<body>
    <div id="header">

    </div>

    <main>
        <div class="container-fluid">
            <div class="row justify-content-center align-items-center">
                <div class="col-12 col-sm-8 col-md-6 col-lg-4 my-5">
                    <div class="card shadow-lg">
                        <div class="card-body" id="bloque">
                            <h4 class="card-title text-center">REESTABLECER CONTRASEÑA</h4>
                            <form>
                                <div class="form-group">
                                    <label for="new-password">Nueva contraseña</label>
                                    <input type="password" class="form-control" id="new-password" placeholder="Ingrese su nueva contraseña">
                                </div>
                                <div class="form-group">
                                    <label for="confirm-password">Confirmar contraseña</label>
                                    <input type="password" class="form-control" id="confirm-password" placeholder="Confirme su nueva contraseña">
                                </div>
                                <br>
                                <div class="form-group text-center">
                                    <button type="submit" class="btn btn-primary" id="but">Reestablecer</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
    </main>

    <div id="footer">

    </div>

    <script src="JS/header_footer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
    integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"

    crossorigin="anonymous"></script>
</body>
</html>
