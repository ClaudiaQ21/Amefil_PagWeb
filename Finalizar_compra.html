<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="CSS/Finalizar_compra.css">
    <link rel="stylesheet" href="css/encabezado_pie.css">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="CSS/Navegacion_productos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/Draggable.min.js"></script>
    <link rel="icon" href="img/img_logo/logoAmefil - solo logo.svg">
    <title>Finalizar Compra</title>
</head>

<body>
    <div id="header">

    </div>
    <div class="row nues_produc m-0">
        <div class="col-12">
            <h3 class="text-center py-4">FINALIZAR COMPRA</h3>
        </div>
    </div>

    <main class="container">
       
        <div id="con" class="row g-10">
            <nav id="central" class="col-lg-8 col-md-12 col-sm-12">
                <h6><b>INGRESA TUS DATOS</b></h6>
                <br>
                <div class="container text-start">
                    <div class="row g-3">
                        <div class="col-lg-6 col-md-6 col-sm-12">
                            <label for="nombre" class="form-label">Nombre:</label>
                            <input type="text" id="nombre" class="form-control" required>

                        </div>
                        <div class="col-lg-6 col-md-6 col-sm-12">
                            <label for="apellido" class="form-label">Apellidos:</label>
                            <input type="text" id="apellido" class="form-control" required>
                        </div>
                        <div class="col-lg-6 col-md-6 col-sm-12">
                            <label class="form-label">Documento de identidad:</label>
                            <input type="text" class="form-control">
                        </div>
                        <div class="col-lg-6 col-md-6 col-sm-12">
                            <label class="form-label">Teléfono/móvil:</label>
                            <input type="text" class="form-control">
                        </div>
                    </div>
                </div>
                <br>
                <h6><b>SELECCIONA TU MÉTODO DE ENTREGA</b></h6>
                <br>
                <div class="container text-center">
                    <div class="row g-3">
                        <div class="col-lg-6 col-md-6 col-sm-12">
                            <button id="boton" class="btn btn-primary" type="submit">Envio a domicilio</button>
                        </div>
                        <div class="col-lg-6 col-md-6 col-sm-12">
                            <button id="boton1" class="btn btn-primary" type="submit">Recojo en tienda</button>
                        </div>
                    </div>
                </div>
                <br>
                <h6><b>COMPLETA TU DIRECCIÓN DE ENVÍO</b></h6>
                <br>
                <div class="container text-start">
                    <div class="row g-3">
                        <div class="col-lg-6 col-md-6 col-sm-12">
                            <button id="combo" class="btn btn-secondary dropdown-toggle" type="button"
                                data-bs-toggle="dropdown" aria-expanded="false">
                                Departamento
                            </button>
                            <br>
                            <button id="combo" class="btn btn-secondary dropdown-toggle" type="button"
                                data-bs-toggle="dropdown" aria-expanded="false">
                                Provincia
                            </button>
                            <br>
                            <button id="combo" class="btn btn-secondary dropdown-toggle" type="button"
                                data-bs-toggle="dropdown" aria-expanded="false">
                                Distrito
                            </button>
                        </div>
                        <div class="col-lg-6 col-md-6 col-sm-12">
                            <label class="form-label">Dirección:</label>
                            <input type="text" class="form-control">
                            <label class="form-label">Referencia (opcional):</label>
                            <input type="text" class="form-control">
                        </div>
                    </div>
                </div>
                <br>
                <h6><b>INGRESE LOS DATOS DE SU TARJETA</b></h6>
                <br>
                <div class="container text-start">
                    <div class="row g-3">
                        <div class="col-lg-6 col-md-6 col-sm-12">
                            <label class="form-label">Tarjeta de crédito:</label>
                            <input type="text" class="form-control">
                        </div>
                        <div class="col-lg-6 col-md-6 col-sm-12">
                            <label class="form-label">Fecha de vencimiento:</label>
                            <br>
                            <button id="com" class="btn btn-secondary dropdown-toggle" type="button"
                                data-bs-toggle="dropdown" aria-expanded="false">
                                MM
                            </button>
                            <button id="com" class="btn btn-secondary dropdown-toggle" type="button"
                                data-bs-toggle="dropdown" aria-expanded="false">
                                AA
                            </button>
                        </div>
                        <div class="col-lg-6 col-md-6 col-sm-12">
                            <label class="form-label">Titular de la tarjeta:</label>
                            <input type="text" class="form-control">
                        </div>
                        <div class="col-lg-6 col-md-6 col-sm-12">
                            <label class="form-label">Código de seguridad:</label>
                            <input type="text" class="form-control">
                        </div>
                    </div>
                </div>
            </nav>
            <section class="col-lg-4 col-md-12 col-sm-12 mt-5">
                <div class="container text-start">
                    <div class="row g-4 justify-content-center">
                        <div class="col-lg-10 col-md-10 col-sm-12">
                            <label class="form-label">Precio envío:</label>
                            <input type="text" class="form-control">
                        </div>
                        <div class="col-lg-10 col-md-10 col-sm-12">
                            <label class="form-label">Total a pagar:</label>
                            <input type="text" class="form-control" id="totalInput">
                        </div>
                        <br>
                        <div class="col-lg-7 col-md-7 col-sm-12">
                            <button class="botones agregar-carrito" type="button" data-bs-toggle="modal" data-bs-target="#compraModal">Pagar</button>


                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <br>
    <br>

    <div id="footer">

    </div>
    <script src="JS/header_footer.js"></script>

    <div class="modal fade" id="compraModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel" style="color: rgb(40, 34, 24);">Compra registrada</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="d-flex align-items-center">
                        <img src="img/logotipo_oro.svg" alt="Logo" style="width: 40%; height: 45px; margin-right: 20px;">
                        <div>
                            <p id="pagoExitoso">PAGO EXITOSO <br>
                                ¡GRACIAS POR SU COMPRA!
                            </p>
                           
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal" style="background-color: rgb(158, 134, 94);border-color: rgb(158, 134, 94);">Aceptar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="JS/carrito.js"></script>
    <script src="JS/bootstrap.bundle.min.js"></script>
    <script src="JS/header_footer.js"></script>
    <script src="JS/jquery-3.7.1.slim.min.js"></script>
    
</body>

</html>
