        <script>
            function changeImage(image) {
                console.log("Changing image to:", image); // Depuración: Imprime la ruta de la imagen
                document.getElementById('hilo').src = image;
            }

            function drag(ev) {
                ev.dataTransfer.setData("text", ev.target.id);
            }

            function allowDrop(ev) {
                ev.preventDefault();
            }

            function drop(ev) {
                ev.preventDefault();
                var data = ev.dataTransfer.getData("text");
                var draggedElement = document.getElementById(data);

                // Solo permitir soltar sobre la imagen del hilo
                if (ev.target.id === 'hilo') {
                    ev.target.appendChild(draggedElement.cloneNode(true));
                }
            }


        </script>
