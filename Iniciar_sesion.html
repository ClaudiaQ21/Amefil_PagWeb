<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/Iniciar_sesion.css">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/Draggable.min.js"></script>
    <link rel="icon" href="img/img_logo/logoAmefil - solo logo.svg">
    <link rel="stylesheet" href="css/encabezado_pie.css">
    <title>Iniciar Sesión</title>
</head>
 
<body>
    <div id="header">

    </div>

    <main class="container">
        <div class="row justify-content-center align-items-center ">
            <div class="col-12 col-sm-8 col-md-6 col-lg-4">
                <div class="card shadow-lg my-5">
                    <div class="card-body" id="bloque">
                        <h4 class="card-title text-center">INICIO DE SESIÓN</h4>
                        <form>
                            <div class="form-group">
                                <label for="email">Correo electrónico</label>
                                <input type="email" class="form-control" id="email"
                                    placeholder="Ingrese su correo electrónico">
                            </div>
                            <div class="form-group">
                                <label for="password">Contraseña</label>
                                <input type="password" class="form-control" id="password"
                                    placeholder="Ingrese su contraseña">
                            </div>
                            <br>
                            <div class="form-group text-center">
                                <a href="Reestablecer_contraseña.html" class="small">¿Olvidaste tu contraseña?</a>
                            </div>
                            <br>
                            <div class="form-group text-center">
                                <button type="submit" class="botones">Ingresar</button>

                            </div>
                            <br>
                            <div class="form-group text-center">
                                <span class="small">¿Todavía no tienes una cuenta? <a href="Registro_usuario.html"
                                        id="regis">Regístrate</a></span>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <div id="footer">

    </div>
    
    <script src="JS/header_footer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
    integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
    crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
    integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
    crossorigin="anonymous"></script>
</body>

</html>
