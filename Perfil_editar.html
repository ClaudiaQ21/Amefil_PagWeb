                <div class="col-lg-8 d-lg-block d-md-none d-none nav-perfil">
                    <ul class="nav justify-content-evenly">
                        <li class="nav-item">
                            <a href="Perfil.html" class="nav-link text-light">Datos Personales</a>
                        </li>
                        <li class="nav-item">
                            <a href="Direccion_lista.html" class="nav-link text-light">Direcciones</a>
                        </li>
                        <li class="nav-item">
                            <a href="Pedidos_lista.html" class="nav-link text-light">Pedidos</a>

                        <li class="nav-item">

                <div class="d-lg-none d-md-block d-block col-6 text-end">

                        </button>
                        <ul class="dropdown-menu">
                            
                        </ul>
                    </div>

                </div>
            </div>

            <div class="row d-flex py-4 volver-inicio">

                    <i class="fa-solid fa-arrow-left pe-3 text-dark regresar"></i>
                    <p class="m-0 text-dark regresar">Regresar</p>
                </a>
            </div>

            <div class="row justify-content-center bloque-info">
                <div class="titulo bloque py-lg-4 py-md-4 pt-0 pb-4">
                    <div class="row mt-0 pt-0 g-4 justify-content-center">
                        <div class="col-lg-12 col-md-12 col-12">
                            <label class="form-label">Nombre *</label>
                            <input type="text" class="form-control datos" id="nombres">
                        </div>
    
                        <div class="col-lg-12 col-md-12 col-12">
                            <label class="form-label">Apellidos *</label>
                            <input type="text" class="form-control datos" id="apellidos">
                        </div>
    
                        <div class="col-lg-12 col-md-12 col-12">
                            <label class="form-label">Departamento</label>
                            <select class="form-select datos" aria-label="Default select example">
                                <option selected>--Seleccione su departamento--</option>
                                <option value="1">Cajamarca</option>
                                <option value="2">Lambayeque</option>
                                <option value="3">Tumbes</option>
                                <option value="4">Moquegua</option>
                                <option value="5">Arequipa</option>
                                <option value="6">Iquitos</option>
                            </select>
                        </div>
    
                        <div class="col-lg-12 col-md-12 col-12">
                            <label class="form-label">Distrito</label>
                            <select class="form-select datos" aria-label="Default select example">
                                <option selected>--Seleccione su distrito--</option>
                            </select>
                        </div>
    
                        <div class="col-lg-12 col-md-12 col-12">
                            <label class="form-label">DNI</label>
                            <input type="text" class="form-control datos" class="lab" id="dni">
                        </div>

                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                    <option value="6">6</option>
                                    <option value="7">7</option>
                                    <option value="8">8</option>
                                    <option value="9">9</option>
                                    <option value="10">10</option>
                                    <option value="11">11</option>
                                    <option value="12">12</option>
                                    <option value="13">13</option>
                                    <option value="14">14</option>
                                    <option value="15">15</option>
                                    <option value="16">16</option>
                                    <option value="17">17</option>
                                    <option value="18">18</option>
                                    <option value="19">19</option>
                                    <option value="20">20</option>
                                    <option value="21">21</option>
                                    <option value="22">22</option>
                                    <option value="23">23</option>
                                    <option value="24">24</option>
                                    <option value="25">25</option>
                                    <option value="26">26</option>

                                    <option value="28">28</option>

                                    <option value="30">30</option>
                                    <option value="31">31</option>
                                </select>
                            </div>
                            <div class="d-block">
                                <label class="form-label">Mes</label>
                                <select class="form-select datos" aria-label="Default select example">
                                    <option value="1">Enero</option>
                                    <option value="2">Febrero</option>
                                    <option value="3">Marzo</option>
                                    <option value="4">Abril</option>
                                    <option value="5">Mayo</option>
                                    <option value="6">Junio</option>
                                    <option value="7">Julio</option>
                                    <option value="8">Agosto</option>

                                    <option value="11">Noviembre</option>
                                    <option value="12">Diciembre</option>
                                </select>

                                <select class="form-select datos" aria-label="Default select example">

                                    <option value="2">2023</option>
                                    <option value="3">2022</option>
                                    <option value="4">2021</option>

                                <option selected>--Seleccione su género--</option>
                                <option value="1">Femenino</option>
                                <option value="2">Masculino</option>
                                <option value="3">Prefiero no decirlo</option>
                            </select>
                        </div>
    
                        <div class="col-lg-12 col-md-12 col-12">
                            <label class="form-label">Celular</label>
                            <input type="text" class="form-control datos" id="celular">
                        </div>
    
                    </div>
            
                    <div class="col-lg-12 boton-guardar mt-4">
                        <button class="botones py-1" onclick="location.href='Perfil.html'">Guardar datos</button>
