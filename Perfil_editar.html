<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amefil</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/perfil.css">
    <link rel="stylesheet" href="css/encabezado_pie.css">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/Draggable.min.js"></script>
    <link rel="icon" href="img/img_logo/logoAmefil - solo logo.svg">
</head>
<body>
    <div id="header">

    </div> 

    <main class="row m-0 p-0">
        <div class="contenedor_info">
            <div class="row">
                <div class="col-lg-1 d-flex align-items-center justify-content-end">
                    <i class="fa-regular fa-user icono-nav-perfil"></i>
                </div>

                <div class="col-lg-3 d-flex align-items-center text-center icono-nav-perfil">
                    ¡Bienvenido!
                </div>

                <div class="col-lg-8 nav-perfil">
                    <ul class="nav  justify-content-evenly">
                        <li class="nav-item">
                            <a href="Perfil.html" class="nav-link text-light">Perfil</a>
                        </li>
                        <li class="nav-item">
                            <a href="Direccion_lista.html" class="nav-link text-light">Direcciones</a>
                        </li>
                        <li class="nav-item">
                            <a href="Pedidos_lista.html" class="nav-link text-light">Pedidos</a>
                        </li>
                        <li class="nav-item">
                            <a href="Favoritos_lista.html" class="nav-link text-light">Mis favoritos</a>
                        </li>
                    </ul>
                </div>
            </div>

            <div class="row d-flex py-4 volver-inicio">
                <a href="index.html" class="d-flex align-items-center ">
                    <i class="fa-solid fa-arrow-left pe-3 text-dark"></i>
                    <p class="m-0 text-dark">Volver al inicio</p>
                </a>
            </div>

            <div class="row titulo bloque">
                <div class="row mt-0 pt-0 g-4 justify-content-center">
                    <div class="col-lg-6 col-md-6 col-sm-12">
                        <label class="form-label">Nombre*</label>
                        <input type="text" class="form-control" id="lab">
                    </div>

                    <div class="col-lg-6 col-md-6 col-sm-12">
                        <label class="form-label">Apellidos*</label>
                        <input type="text" class="form-control" id="lab">
                    </div>

                    <div class="col-lg-6 col-md-6 col-sm-12">
                        <label class="form-label">Departamento</label>
                        <select class="form-select" aria-label="Default select example">
                            <option selected>--Seleccione su departamento--</option>
                            <option value="1">Cajamarca</option>
                            <option value="2">Lambayeque</option>
                            <option value="3">Tumbres</option>
                        </select>
                    </div>

                    <div class="col-lg-6 col-md-6 col-sm-12">
                        <label class="form-label">Distrito</label>
                        <select class="form-select" aria-label="Default select example">
                            <option selected>--Seleccione su distrito--</option>
                        </select>
                    </div>

                    <div class="col-lg-6 col-md-6 col-sm-12">
                        <label class="form-label">DNI</label>
                        <input type="text" class="form-control" id="lab">
                    </div>

                    <div class="col-lg-6 col-md-6 col-sm-12 d-flex justify-content-between">
                        <div class="d-block">
                            <label class="form-label">Día</label>
                            <select class="form-select" aria-label="Default select example">
                                <option value="1">21</option>
                            </select>
                        </div>
                        <div class="d-block">
                            <label class="form-label">Mes</label>
                            <select class="form-select" aria-label="Default select example">
                                <option value="1">05</option>
                            </select>
                        </div>
                        <div class="d-block">
                            <label class="form-label">Año</label>
                            <select class="form-select" aria-label="Default select example">
                                <option value="1">2005</option>
                            </select>
                        </div>
                    </div>

                    <div class="col-lg-6 col-md-6 col-sm-12">
                        <label class="form-label">Género</label>
                        <select class="form-select" aria-label="Default select example">
                            <option selected>--Seleccione su género--</option>
                            <option value="1">Femenino</option>
                            <option value="2">Masculino</option>
                        </select>
                    </div>

                    <div class="col-lg-6 col-md-6 col-sm-12">
                        <label class="form-label">Celular</label>
                        <input type="text" class="form-control" id="lab">
                    </div>

                </div>
        
                <div class="col-lg-12 my-3">
                    <button class="botones" onclick="location.href='Perfil.html'">Guardar datos</button>
                </div>
            </div>
        </div>
    </main>

    <div id="footer">

    </div>

    <script src="JS/header_footer.js"></script>

<script src="js/index.js"></script>
<script src="js/bootstrap.bundle.min.js"></script>

</body>
</html>
