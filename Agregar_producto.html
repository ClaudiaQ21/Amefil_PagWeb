<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Insertar Producto</title>
</head>
<body>
    <h1>Insertar un Nuevo Producto</h1>
    <form action="{{url_for('guardar_producto')}}" method="POST" enctype="multipart/form-data">
        <label for="nombre">Nombre:</label>
        <input type="text" name="nombre" required><br>

        <label for="precio">Precio:</label>
        <input type="number" name="precio" step="0.01" required><br>

        <label for="id_tipo_producto">Tipo Producto:</label>
        <input type="number" name="id_tipo_producto" required><br>

        <label for="vigencia">Vigencia:</label>
        <input type="number" name="vigencia" required><br>
        
        <label for="stock">Stock:</label>
        <input type="number" name="stock" required><br>

        <label for="descripcion">Descripción:</label>
        <input type="text" name="descripcion"><br>
        
        <label for="color">Color:</label>
        <input type="number" name="color" required><br>

        <label for="id_temporada">Temporada:</label>
        <input type="number" name="id_temporada" required><br>

        <label for="id_talla">Talla:</label>
        <input type="number" name="id_talla" ><br>

        <label for="img">Imagen:</label>
        <input type="file" name="img" required><br><br>

        <button type="submit">Insertar Producto</button>
    </form>
</body>
</html>
